<h1>宠物日常护理知识</h1>
<h2>🐾 一、毛发护理</h2>
<p>定期梳毛，短毛宠物每周1次，长毛宠物2~3天一次，减少浮毛、预防打结。洗澡不要过于频繁，一般2~4周一次，使用宠物专用沐浴露，禁止用人的洗发水。</p >
<h2>🦷 二、口腔护理</h2>
<p>从小习惯刷牙，使用宠物专用牙膏牙刷；可以搭配洁齿零食，预防牙结石、口臭。</p >
<h2>👣 三、指甲护理</h2>
<p>观察指甲长度，过长及时修剪，避开血线；如果不敢操作，可以带去宠物店处理。</p >
<h2>🥣 四、饮食要点</h2>
<p>不要投喂巧克力、葡萄、洋葱、大蒜等有毒食物。保证干净饮用水全天供应，定时定量喂食。</p >
<h2>🏥 五、基础健康</h2>
<p>按时疫苗与体内外驱虫。留意精神、食欲、排便，出现异常及时就医。</p >
